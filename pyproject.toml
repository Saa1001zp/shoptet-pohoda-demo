[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoptet-pohoda-demo"
version = "1.0.0"
description = "Synthetic Shoptet -> Pohoda demo pack for perepolkin.sk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "perepolkin.sk demo" }]
dependencies = [
    "pydantic>=2.7,<3",
    "lxml>=5.2,<7",
    "pdfplumber>=0.11,<1",
    "reportlab>=4.1,<5",
    "rich>=13.7,<15",
    "faker>=25,<40",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
shoptet-demo = "demo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["demo"]

[tool.pytest.ini_options]
testpaths = ["demo/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
